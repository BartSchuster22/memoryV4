name: memoryv4-core-ci

on:
  push:
    branches: [main, c1-core-governance-store]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: make test

      - name: Run QA10 placeholder
        run: make qa10

      - name: Check guardrail self-test
        run: make guardrails-check

      - name: Build container
        run: make docker-build
