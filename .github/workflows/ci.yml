name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Run tests in the container image
        run: make docker-test

      - name: Emit QA10 placeholder scorecard
        run: make qa10

      - name: Upload QA10 scorecard
        uses: actions/upload-artifact@v4
        with:
          name: qa10-scorecard
          path: build/qa10-scorecard.json
